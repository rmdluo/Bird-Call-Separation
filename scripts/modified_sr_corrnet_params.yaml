general:
  device: "cuda:0"
  batch_size: 8
  epochs: 100
  num_workers: 16
  eps: 0.000001
  model_save_frequency: 5
  seed: 42
  compile: false
  model_save_path: "../models/modified_sr_corrnet/"

### Initial runs

run-1:
  enable: true
  train_params:
    lr: 0.01
    loss_clipping: 30.0
  model_params:
    num_encoder_blocks: 1
    num_decoder_blocks: 1
    num_speakers: 3
    dim: 32
    dim_feedforward: 64
    nheads: 4
    kernel_size_feedforward: 7
    n_fft: 128
    win_length: 128
    hop_length: 64

